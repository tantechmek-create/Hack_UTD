[project]
name = "overlooked-area-detector"
version = "0.1.0"
description = "Find disaster-hit neighborhoods that are not asking for help, from public data."
requires-python = ">=3.11"
dependencies = [
    # API + shared core (this is all the backend container needs)
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "numpy>=1.26",
    "scipy>=1.13",
    "pydantic>=2.8",
    "pyyaml>=6",
    "jinja2>=3.1",
]

[project.optional-dependencies]
pipeline = [
    "requests>=2.32",
    "geopandas>=1.0",
    "shapely>=2.0",
    "rasterio>=1.4",
    "rasterstats>=0.20",
    "scikit-learn>=1.5",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend", "."]

[tool.ruff]
line-length = 100
